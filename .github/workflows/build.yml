name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Vybeee branding font
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf \
            -o app/src/main/res/font/fredoka_semibold.ttf
          test -s app/src/main/res/font/fredoka_semibold.ttf

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.VYBEEE_KEYSTORE_BASE64 }}
          VYBEEE_KEYSTORE_PASSWORD: ${{ secrets.VYBEEE_KEYSTORE_PASSWORD }}
          VYBEEE_KEY_ALIAS: ${{ secrets.VYBEEE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing VYBEEE_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          # Normalize any accidental whitespace introduced while pasting the secret.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/vybeee-release.jks"
          echo "Verifying decoded signing keystore..."
          echo "Decoded keystore size: $(wc -c < "$RUNNER_TEMP/vybeee-release.jks") bytes"
          if ! keytool -list -keystore "$RUNNER_TEMP/vybeee-release.jks" \
            -storepass "$VYBEEE_KEYSTORE_PASSWORD" \
            -alias "$VYBEEE_KEY_ALIAS"; then
            echo "ERROR: The GitHub secret decoded, but keytool could not open the keystore."
            echo "The original local keystore should NOT be regenerated."
            exit 1
          fi
          echo "Signing keystore verified."

      - name: Build signed release APK
        env:
          VYBEEE_KEYSTORE_PATH: ${{ runner.temp }}/vybeee-release.jks
          VYBEEE_KEYSTORE_PASSWORD: ${{ secrets.VYBEEE_KEYSTORE_PASSWORD }}
          VYBEEE_KEY_ALIAS: ${{ secrets.VYBEEE_KEY_ALIAS }}
          VYBEEE_KEY_PASSWORD: ${{ secrets.VYBEEE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybeee-apk
          path: app/build/outputs/apk/release/app-release.apk
