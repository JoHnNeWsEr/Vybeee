name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.VYBEEE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing VYBEEE_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vybeee-release.jks"

      - name: Build signed release APK
        env:
          VYBEEE_KEYSTORE_PATH: ${{ runner.temp }}/vybeee-release.jks
          VYBEEE_KEYSTORE_PASSWORD: ${{ secrets.VYBEEE_KEYSTORE_PASSWORD }}
          VYBEEE_KEY_ALIAS: ${{ secrets.VYBEEE_KEY_ALIAS }}
          VYBEEE_KEY_PASSWORD: ${{ secrets.VYBEEE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybeee-apk
          path: app/build/outputs/apk/release/app-release.apk
